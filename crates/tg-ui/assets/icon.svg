<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1a0f"/>
      <stop offset="1" stop-color="#020402"/>
    </linearGradient>
    <radialGradient id="phosphor" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#33ff66" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#33ff66" stop-opacity="0"/>
    </radialGradient>
    <pattern id="scanlines" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="3" fill="#000" fill-opacity="0.35"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="body"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#screen)" filter="url(#shadow)"/>
  <g clip-path="url(#body)">
    <rect x="100" y="100" width="824" height="824" fill="url(#phosphor)"/>
    <g filter="url(#glow)" fill="none" stroke="#33ff66" stroke-width="36" stroke-linecap="round" stroke-linejoin="round">
      <path d="M310 260H714A90 90 0 0 1 804 350V590A90 90 0 0 1 714 680H470L330 790L350 680H310A90 90 0 0 1 220 590V350A90 90 0 0 1 310 260Z"/>
      <polyline points="402,390 492,470 402,550"/>
      <rect x="556" y="398" width="84" height="152" fill="#33ff66" stroke="none"/>
    </g>
    <rect x="100" y="100" width="824" height="824" fill="url(#scanlines)"/>
  </g>
  <rect x="103" y="103" width="818" height="818" rx="182" fill="none" stroke="#33ff66" stroke-opacity="0.25" stroke-width="6"/>
</svg>
