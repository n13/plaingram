[package]
name = "tg-core"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
async-channel = "2"
base64 = "0.23.1"
getrandom = "0.4.3"
# Decodes, turns upright and resizes the user's own photos for upload. GPUI already builds these codecs into the app.
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
jpeg-encoder = { version = "0.7.1", default-features = false, features = ["std"] }
keyring = "4"
td = { path = "../td" }
tokio = { version = "1", features = ["rt-multi-thread"] }
tracing = "0.1"
unicode-normalization = "0.1"
unicode-security = "0.1.3"
unicode-segmentation = "1"
# Vendored, so the SIMD (unsafe) features GPUI and resvg enable on the crates.io copy stay off here; see vendor/README.md.
zune-jpeg = { path = "../../vendor/zune-jpeg", default-features = false, features = ["std"] }

[features]
demo = []
