[package]
name = "tg-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
async-channel = "2"
base64 = "0.23.1"
getrandom = "0.4.3"
keyring = "4"
td = { path = "../td" }
tokio = { version = "1", features = ["rt-multi-thread"] }
tracing = "0.1"
unicode-segmentation = "1"
zune-jpeg = { version = "0.5", default-features = false, features = ["std"] }

[dev-dependencies]
jpeg-encoder = "0.7.1"

[features]
demo = []
